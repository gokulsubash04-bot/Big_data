services:
  namenode:
    build: .
    container_name: hadoop-namenode
    hostname: namenode
    command: ["namenode"]
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    networks:
      - hadoop-net

  datanode:
    build: .
    container_name: hadoop-datanode
    hostname: datanode
    command: ["datanode"]
    ports:
      - "9864:9864"
    depends_on:
      - namenode
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    networks:
      - hadoop-net

  resourcemanager:
    build: .
    container_name: hadoop-resourcemanager
    hostname: resourcemanager
    command: ["resourcemanager"]
    ports:
      - "8088:8088"
    depends_on:
      - namenode
      - datanode
    networks:
      - hadoop-net

  nodemanager:
    build: .
    container_name: hadoop-nodemanager
    hostname: nodemanager
    command: ["nodemanager"]
    depends_on:
      - resourcemanager
    networks:
      - hadoop-net

  analytics-runner:
    build: .
    container_name: bigdata-analytics-runner
    command: ["runner"]
    depends_on:
      - namenode
      - datanode
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    networks:
      - hadoop-net

  web-dashboard:
    build: .
    container_name: bigdata-web-dashboard
    command: ["dashboard"]
    ports:
      - "8501:8501"
    depends_on:
      - analytics-runner
    volumes:
      - ./output:/app/output
      - ./data:/app/data
    networks:
      - hadoop-net

networks:
  hadoop-net:
    driver: bridge

volumes:
  hadoop_namenode:
  hadoop_datanode:
